<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אין חיבור לאינטרנט · booqli Games</title>
<meta name="robots" content="noindex">
<style>
:root{--pink-btn:#E0399F;--pink-shadow:#A3216F;--mint:#E1F0EA;--sage-deep:#4E8576;--magenta:#C13671;--ink:#2B1526;--muted:#6b5a66}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Fredoka,Assistant,Arial,sans-serif;color:var(--ink);background:linear-gradient(#F4FAF7,var(--mint));text-align:center}
.pg{display:flex;align-items:center;justify-content:center;padding:32px 16px;min-height:70vh}
.c{background:#fff;border-radius:28px;padding:28px 22px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(78,133,118,.18)}
img{width:96px;height:96px;border-radius:24px;display:block;margin:0 auto 12px}
h1{margin:0;font-size:26px;color:var(--magenta)}
p{color:var(--muted);font-family:Assistant,Arial,sans-serif;font-size:17px;line-height:1.5}
button{background:var(--pink-btn);color:#fff;border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 4px 0 var(--pink-shadow)}
a{color:var(--sage-deep);font-weight:700}
</style>
<!-- בלי קפיצות בטעינה: העמוד מוצג כשהסרגלים במקום (common.js), ולבד אחרי 1.5 שניות -->
<style>body{visibility:hidden;animation:bqShow 0s 1.5s forwards}html.bq-ready body{visibility:visible;animation:none}@keyframes bqShow{to{visibility:visible}}</style>
<link rel="preload" href="/common.js" as="script">
</head>
<body>
<div class="pg"><div class="c">
  <img src="/img/app/icon-192.png" alt="" width="96" height="96">
  <h1>אופס, אין אינטרנט 📶</h1>
  <p>העמוד הזה עוד לא נשמר בטלפון. עמודים שכבר פתחתם נפתחים גם בלי חיבור.</p>
  <button type="button" onclick="location.reload()">🔄 לנסות שוב</button>
  <p id="kidsOff" hidden style="background:#FFF1C9;border-radius:16px;padding:10px;margin-top:6px">✈️ משחקי הילדים שמורים בטלפון: <a href="/kids/">🎲 לשחק בלי אינטרנט ←</a></p>
  <p><a href="/">לדף הבית</a></p>
  <p style="background:#FFE6E8;border-radius:16px;padding:10px;margin-top:6px">🚨 יש אזעקה? <a href="/topics/safety/" style="color:#8E1F2C">מה עושים · פרח ונר · הספר "מה אתה עושה כאן, פחד?" ←</a></p>
</div></div>
<script src="/common.js"></script>
<script>try { if (localStorage.getItem("booqli_offline")) document.getElementById("kidsOff").hidden = false; } catch (e) {}</script>
</body>
</html>
